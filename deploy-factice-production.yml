---
- name: Deploy factice to production environment
  hosts: localhost
  gather_facts: true
  vars:
    ansible_connection: local
    factice_environment: production

  pre_tasks:
    - name: Require production confirmation
      pause:
        prompt: |
          ⚠️  PRODUCTION DEPLOYMENT ⚠️

          This will deploy factice to production (port :9080).
          Type 'yes' to continue, or Ctrl+C to cancel
      register: prod_confirm

    - name: Verify production confirmation
      assert:
        that:
          - prod_confirm.user_input | lower == 'yes'
        fail_msg: "Production deployment cancelled"

  roles:
    - factice

  post_tasks:
    - name: Verify production stack
      uri:
        url: "http://localhost:9080/health"
        status_code: 200
      retries: 5
      delay: 5

    - name: Production deployment complete
      debug:
        msg: |
          ✅ Factice PRODUCTION deployed:
          - Web:   http://localhost:9080
          - API:   http://localhost:9080/items
          - DB:    localhost:5433/factice_production
