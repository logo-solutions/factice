---
- name: Deploy factice to production environment
  hosts: localhost
  gather_facts: true
  vars:
    ansible_connection: local
    factice_environment: production

  pre_tasks:
    - name: Require an approved ITSM change
      assert:
        that:
          - change_id is defined
          - change_id | regex_search('^CHG-[0-9]{4}-[0-9]{4}$')
        fail_msg: "Production : passer -e change_id=CHG-AAAA-NNNN (changement approuvé dans l'ITSM, vérifié par le job change-gate)"

  roles:
    - factice

  post_tasks:
    - name: Verify production stack
      uri:
        url: "http://localhost:9080/health"
        status_code: 200
      retries: 5
      delay: 5

    - name: Production deployment complete
      debug:
        msg: |
          ✅ Factice PRODUCTION deployed:
          - Web:   http://localhost:9080
          - API:   http://localhost:9080/items
          - DB:    localhost:5433/factice_production
