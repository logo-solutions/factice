name: CI/CD

# Contrat Nexus : Docs/2-pipeline-livraison/registry/nexus-spec.md, section 8.1.
#   build    -> publication en candidat (compte de build de l'application)
#   promote  -> contrôles puis republication en release (compte de promotion)
#   deploy-* -> déploiement d'une release par empreinte (compte en lecture seule)
# Variables du dépôt : NEXUS_URL, NEXUS_DOCKER_CANDIDAT, NEXUS_DOCKER_RELEASE
# Secrets : NEXUS_BUILD_PASSWORD, NEXUS_PROMOTION_PASSWORD, NEXUS_DEPLOY_PASSWORD
# Contrat ITSM et CMDB : Docs/1-fondations/flux-outils-factice.md (flux 2, 10, 11, 12).
#   integration -> changement standard créé par le pipeline (trace), puis lié et clos
#   production  -> changement normal : approuvé par un humain dans l'ITSM avant le déploiement
#   après chaque déploiement réussi : inventaire écrit dans la CMDB (flux 10)
# Secrets supplémentaires : ITSM_TOKEN (droits read, create, link, close), CMDB_TOKEN.
# Variables facultatives : ITSM_URL, CMDB_URL (défauts : services locaux du Mac Mini).
# Incidents et KB (flux 13, 14) : un déploiement en échec ouvre un incident ITSM ; l'incident ne se
#   clôt en succès qu'avec une fiche KB-NNN (itsm.sh kb). Le job kb-check refuse un commit fix sans
#   fiche dans Docs/kb.md (ou trailer « KB: non-applicable »).
# Exigences et preuves (flux 1, 6, 7) : req-check (un feat/fix cite ACC-04, etc.), preuves de tests
#   par exigence (artefact preuves-exigences), notes de version à la promotion (artefact notes-de-version).
# L'incident ouvert sur échec porte l'élément de configuration CMDB du service (flux 12).
# Aucun secret n'est passé en argument de commande.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deploy to environment'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - integration
          - production
      change_id:
        description: 'Production : identifiant du changement ITSM approuvé (vide = en créer un)'
        required: false
        default: ''
        type: string

env:
  APP_ID: factice.app
  COMPONENT: factice
  NEXUS_URL: ${{ vars.NEXUS_URL }}
  NEXUS_DOCKER_CANDIDAT: ${{ vars.NEXUS_DOCKER_CANDIDAT }}
  NEXUS_DOCKER_RELEASE: ${{ vars.NEXUS_DOCKER_RELEASE }}
  ITSM_URL: ${{ vars.ITSM_URL || 'http://127.0.0.1:8095' }}
  CMDB_URL: ${{ vars.CMDB_URL || 'http://127.0.0.1:8096' }}

jobs:
  kb-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tout correctif doit capitaliser dans Docs/kb.md
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TETE: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ]; then BASE="0000000"; fi
          scripts/kb/check-kb.sh "$BASE" "$TETE"

  req-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tout feat/fix cite une exigence (flux 1)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TETE: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ]; then BASE="0000000"; fi
          scripts/req/check-req.sh "$BASE" "$TETE"

  build:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Run tests
        run: npm test
        working-directory: app

      - name: Preuves de tests par exigence (flux 6)
        run: node scripts/req/evidence.js

      - uses: actions/upload-artifact@v4
        with:
          name: preuves-exigences
          path: preuves/preuves-exigences.md

      - id: meta
        run: |
          echo "version=$(jq -r .version app/package.json)" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t "factice:${{ github.sha }}" app

      - name: Publish candidate (image + SBOM + manifest)
        if: github.event_name != 'pull_request'
        env:
          NEXUS_USER: svc-build-factice-app
          NEXUS_PASSWORD: ${{ secrets.NEXUS_BUILD_PASSWORD }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          COMMIT: ${{ github.sha }}
          IMAGE: factice:${{ github.sha }}
          APP_DIR: app
        run: |
          COMMIT_DATE="$(git log -1 --format=%cI)" scripts/nexus/publish-candidate.sh

  promote:
    needs: build
    runs-on: self-hosted
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    outputs:
      release: ${{ steps.promote.outputs.release }}
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: preuves-exigences
          path: preuves

      - id: promote
        env:
          NEXUS_USER: svc-promotion
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PROMOTION_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          REPO_DIR: ${{ github.workspace }}
          PROTECTED_REFS: origin/main
        run: scripts/nexus/promote.sh | tee -a "$GITHUB_OUTPUT"

      - name: Notes de version (flux 7)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ steps.promote.outputs.digest }}
          BASE: ${{ github.event.before }}
        run: |
          mkdir -p notes
          scripts/release/notes.sh "$VERSION" "$DIGEST" "$BASE" | tee notes/notes-de-version.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: notes-de-version
          path: notes/notes-de-version.md

  deploy-integration:
    needs: [build, promote]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_env == 'integration'
    steps:
      - uses: actions/checkout@v4

      - name: Trace ITSM (changement standard pré-approuvé)
        id: change
        env:
          ITSM_TOKEN: ${{ secrets.ITSM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ID="$(scripts/itsm/itsm.sh create standard \
            "Déploiement factice ${VERSION} en integration" \
            "Release ${{ needs.promote.outputs.digest }}, commit ${{ github.sha }}" integration)"
          echo "id=${ID}" >> "$GITHUB_OUTPUT"

      - name: Deploy release to integration
        id: deploy
        env:
          NEXUS_DEPLOY_PASSWORD: ${{ secrets.NEXUS_DEPLOY_PASSWORD }}
        run: |
          ansible-playbook deploy-factice-integration.yml \
            --vault-password-file ~/.factice-vault-pass \
            -e "factice_release_image=${NEXUS_DOCKER_RELEASE}/${APP_ID}/${COMPONENT}@${{ needs.promote.outputs.digest }}"

      - name: Verify integration health
        run: curl -f http://localhost:8070/health

      - name: Deployment event
        if: always()
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.promote.outputs.digest }}
          ENVIRONMENT: integration
          RESULT: ${{ job.status == 'success' && 'reussi' || 'echoue' }}
        run: scripts/nexus/deployment-event.sh

      - name: Inventaire CMDB (flux 10)
        id: cmdb
        if: success()
        env:
          CMDB_TOKEN: ${{ secrets.CMDB_TOKEN }}
          DIGEST: ${{ needs.promote.outputs.digest }}
        run: |
          CI_URL="$(scripts/cmdb/cmdb.sh register-service "$APP_ID" macmini "$COMPONENT" 8070 "$DIGEST" integration)"
          echo "ci=${CI_URL}" >> "$GITHUB_OUTPUT"

      - name: Clore le changement ITSM
        if: always() && steps.change.outputs.id != ''
        env:
          ITSM_TOKEN: ${{ secrets.ITSM_TOKEN }}
          CHANGE_ID: ${{ steps.change.outputs.id }}
          DIGEST: ${{ needs.promote.outputs.digest }}
          CI_URL: ${{ steps.cmdb.outputs.ci }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status == 'success' && 'succes' || 'echec' }}
        run: |
          scripts/itsm/itsm.sh link "$CHANGE_ID" "$DIGEST" "$RUN_URL" integration "$CI_URL"
          scripts/itsm/itsm.sh close "$CHANGE_ID" "$RESULT"

      - name: Ouvrir un incident ITSM (échec du déploiement)
        if: failure()
        env:
          ITSM_TOKEN: ${{ secrets.ITSM_TOKEN }}
          CMDB_TOKEN: ${{ secrets.CMDB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CI_URL="$(scripts/cmdb/cmdb.sh ci-url "$APP_ID" "$COMPONENT" integration 2>/dev/null || true)"
          ID="$(scripts/itsm/itsm.sh create incident \
            "Échec du déploiement factice en integration" \
            "Run ${RUN_URL}, commit ${{ github.sha }}" integration "$CI_URL")" || exit 0
          echo "::warning::Incident ${ID} ouvert. Documenter la cause dans Docs/kb.md (fiche KB-NNN), puis : itsm.sh kb ${ID} KB-NNN et itsm.sh close ${ID} succes."

  change-gate:
    needs: [build, promote]
    runs-on: self-hosted
    if: github.event.inputs.deploy_env == 'production'
    outputs:
      change: ${{ steps.gate.outputs.change }}
    steps:
      - uses: actions/checkout@v4

      - name: Exiger un changement approuvé dans l'ITSM (flux 2)
        id: gate
        env:
          ITSM_TOKEN: ${{ secrets.ITSM_TOKEN }}
          CHANGE_ID: ${{ github.event.inputs.change_id }}
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.promote.outputs.digest }}
        run: |
          if [ -z "$CHANGE_ID" ]; then
            ID="$(scripts/itsm/itsm.sh create normal \
              "Déploiement factice ${VERSION} en production" \
              "Release ${DIGEST}, commit ${{ github.sha }}" production)"
            echo "::error::Changement ${ID} créé en brouillon. Le faire approuver dans l'ITSM, puis relancer avec change_id=${ID}."
            exit 1
          fi
          scripts/itsm/itsm.sh require-approved "$CHANGE_ID"
          echo "change=${CHANGE_ID}" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: [build, promote, change-gate]
    runs-on: self-hosted
    if: github.event.inputs.deploy_env == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy release to production
        env:
          NEXUS_DEPLOY_PASSWORD: ${{ secrets.NEXUS_DEPLOY_PASSWORD }}
        run: |
          ansible-playbook deploy-factice-production.yml \
            --vault-password-file ~/.factice-vault-pass \
            -e "factice_release_image=${NEXUS_DOCKER_RELEASE}/${APP_ID}/${COMPONENT}@${{ needs.promote.outputs.digest }}" \
            -e "change_id=${{ needs.change-gate.outputs.change }}"

      - name: Verify production health
        run: curl -f http://localhost:9080/health

      - name: Deployment event
        if: always()
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.promote.outputs.digest }}
          ENVIRONMENT: production
          RESULT: ${{ job.status == 'success' && 'reussi' || 'echoue' }}
        run: scripts/nexus/deployment-event.sh

      - name: Inventaire CMDB (flux 10)
        id: cmdb
        if: success()
        env:
          CMDB_TOKEN: ${{ secrets.CMDB_TOKEN }}
          DIGEST: ${{ needs.promote.outputs.digest }}
        run: |
          CI_URL="$(scripts/cmdb/cmdb.sh register-service "$APP_ID" macmini "$COMPONENT" 9080 "$DIGEST" production)"
          echo "ci=${CI_URL}" >> "$GITHUB_OUTPUT"

      - name: Lier et clore le changement ITSM
        if: always()
        env:
          ITSM_TOKEN: ${{ secrets.ITSM_TOKEN }}
          CHANGE_ID: ${{ needs.change-gate.outputs.change }}
          DIGEST: ${{ needs.promote.outputs.digest }}
          CI_URL: ${{ steps.cmdb.outputs.ci }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status == 'success' && 'succes' || 'echec' }}
        run: |
          scripts/itsm/itsm.sh link "$CHANGE_ID" "$DIGEST" "$RUN_URL" production "$CI_URL"
          scripts/itsm/itsm.sh close "$CHANGE_ID" "$RESULT"

      - name: Ouvrir un incident ITSM (échec du déploiement)
        if: failure()
        env:
          ITSM_TOKEN: ${{ secrets.ITSM_TOKEN }}
          CMDB_TOKEN: ${{ secrets.CMDB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CI_URL="$(scripts/cmdb/cmdb.sh ci-url "$APP_ID" "$COMPONENT" production 2>/dev/null || true)"
          ID="$(scripts/itsm/itsm.sh create incident \
            "Échec du déploiement factice en production" \
            "Run ${RUN_URL}, commit ${{ github.sha }}" production "$CI_URL")" || exit 0
          echo "::warning::Incident ${ID} ouvert. Documenter la cause dans Docs/kb.md (fiche KB-NNN), puis : itsm.sh kb ${ID} KB-NNN et itsm.sh close ${ID} succes."
