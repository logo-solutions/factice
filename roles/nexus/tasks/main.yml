---
- name: Validate Nexus deployment prerequisites
  assert:
    that:
      - nexus_docker_image is defined
      - nexus_docker_data_dir is defined
    fail_msg: "Required Nexus variables not defined"

- name: Deploy Nexus stack using deploy_stack role
  include_role:
    name: deploy_stack
  vars:
    stack_name: "{{ nexus_container_name }}"
    stack_dir: "{{ stack_dir }}"
    compose_template: "docker-compose.yml.j2"
    pull_images: true
    healthcheck_urls: ["http://localhost:{{ nexus_docker_port_http }}/"]

- name: Configure Nexus blob stores
  include_tasks: blob_stores.yml

- name: Configure Nexus repositories
  include_tasks: repositories.yml

- name: Configure repository groups
  include_tasks: groups.yml

- name: Configure cleanup policies
  include_tasks: cleanup.yml

- name: Apply security configuration
  include_tasks: security.yml

- name: Establish CI/CD contract
  include_tasks: cicd_contract.yml

- name: Integrate with CMDB
  include_tasks: cmdb_integration.yml

- name: Run acceptance tests
  include_tasks: acceptance_tests.yml

- name: Log Nexus deployment status
  debug:
    msg: |
      Nexus Repository Manager deployed successfully
      HTTP Port: {{ nexus_docker_port_http }}
      Docker Registry: {{ nexus_docker_port_docker_registry }}
      Data Directory: {{ nexus_docker_data_dir }}
      Container: {{ nexus_container_name }}
