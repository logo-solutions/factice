---
- name: Valider les variables obligatoires
  assert:
    that:
      - nexus_admin_password is defined
      - nexus_admin_password | length > 0
    fail_msg: "nexus_admin_password est obligatoire (coffre Ansible)"
  no_log: true

- name: Déployer le conteneur Nexus
  include_tasks: deploy.yml
  when: nexus_manage_container | bool

- name: Appliquer la configuration de Nexus
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ nexus_admin_username }}"
      url_password: "{{ nexus_admin_password }}"
      force_basic_auth: true
      timeout: 60
  block:
    - name: Amorcer l'instance (disponibilité, mot de passe administrateur)
      include_tasks: bootstrap.yml

    - name: Blob stores
      include_tasks: blob_stores.yml

    - name: Politiques de nettoyage
      include_tasks: cleanup.yml

    - name: Dépôts et groupes
      include_tasks: repositories.yml

    - name: Droits, rôles et comptes de service
      include_tasks: security.yml

    - name: Tâches planifiées
      include_tasks: scheduled_tasks.yml

    - name: Contrôles de conformité
      include_tasks: acceptance_tests.yml
