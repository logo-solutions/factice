---
- name: Disable anonymous access
  uri:
    url: "http://localhost:{{ nexus_docker_port_http }}/service/rest/v1/security/anonymous"
    method: PUT
    user: "admin"
    password: "{{ security.admin_password }}"
    force_basic_auth: true
    body_format: json
    body: |
      {
        "enabled": {{ security.enable_anonymous_access | lower }},
        "userId": "anonymous",
        "realmName": "NexusAuthenticatingRealm"
      }
    status_code: [200, 204, 401]
  when: not security.enable_anonymous_access | bool
  register: anon_config
  ignore_errors: true

- name: Configure authentication realms
  uri:
    url: "http://localhost:{{ nexus_docker_port_http }}/service/rest/v1/security/realms/active"
    method: PUT
    user: "admin"
    password: "{{ security.admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ security.enable_realms }}"
    status_code: [200, 204, 401]
  register: realm_config
  ignore_errors: true

- name: Configure LDAP if enabled
  block:
    - name: Create LDAP authentication source
      uri:
        url: "http://localhost:{{ nexus_docker_port_http }}/service/rest/v1/security/ldap"
        method: POST
        user: "admin"
        password: "{{ security.admin_password }}"
        force_basic_auth: true
        body_format: json
        body: |
          {
            "name": "{{ security.ldap_config.name }}",
            "protocol": "ldap",
            "useTrustStore": false,
            "connectionTimeout": 30000,
            "connectionRetryDelay": 300,
            "maxIncidentsCount": 5,
            "maxIncidentsDelay": 86400000,
            "host": "{{ security.ldap_config.connection_url | urlsplit('hostname') }}",
            "port": {{ security.ldap_config.connection_url | urlsplit('port') | default(389) }},
            "searchBase": "{{ security.ldap_config.base_dn }}",
            "authentication": "simple",
            "simpleAuthScheme": "PLAIN",
            "userBaseDn": "{{ security.ldap_config.base_dn }}",
            "userSubtree": false,
            "userObjectClass": "{{ security.ldap_config.user_object_class }}",
            "userIdAttribute": "{{ security.ldap_config.user_id_attribute }}",
            "userRealNameAttribute": "cn",
            "userEmailAttribute": "mail",
            "ldapGroupsAsRoles": false,
            "groupBaseDn": "{{ security.ldap_config.base_dn }}",
            "groupSubtree": false,
            "groupObjectClass": "groupOfUniqueNames",
            "groupIdAttribute": "cn",
            "groupMemberAttribute": "uniqueMember",
            "groupMemberFormat": "${dn}",
            "userMemberOfAttribute": "memberOf"
          }
        status_code: [201, 400, 401]
      when: security.ldap_config.enabled | bool
      register: ldap_config
      ignore_errors: true
  when: security.ldap_config is defined

- name: Set admin user password
  uri:
    url: "http://localhost:{{ nexus_docker_port_http }}/service/rest/v1/security/users/admin/change-password"
    method: PUT
    user: "admin"
    password: "admin123"
    force_basic_auth: true
    body_format: json
    body: |
      {
        "password": "{{ security.admin_password }}"
      }
    status_code: [200, 204, 401]
  register: password_result
  ignore_errors: true
  no_log: true

- name: Log security configuration results
  debug:
    msg: |
      Anonymous Access: {{ security.enable_anonymous_access }}
      Authentication Realms: {{ security.enable_realms | join(', ') }}
      LDAP Enabled: {{ security.ldap_config.enabled | default(false) }}
