---
- name: Integrate Nexus with CMDB
  block:
    - name: Prepare CMDB metadata
      set_fact:
        nexus_cmdb_metadata:
          service_name: "nexus-repository-manager"
          service_version: "{{ nexus_docker_image | split(':') | last }}"
          deployment_type: "docker"
          container_name: "{{ nexus_container_name }}"
          data_directory: "{{ nexus_docker_data_dir }}"
          ports:
            http: "{{ nexus_docker_port_http }}"
            https: "{{ nexus_docker_port_https }}"
            docker_registry: "{{ nexus_docker_port_docker_registry }}"
          tags: "{{ cmdb_integration.metadata_tags }}"
          deployment_timestamp: "{{ ansible_date_time.iso8601 }}"
          blob_stores: "{{ blob_stores | map(attribute='name') | list }}"
          repositories: "{{ (repositories.maven | map(attribute='name')) + (repositories.docker | map(attribute='name')) + (repositories.npm | map(attribute='name')) | list }}"

    - name: Write CMDB metadata file locally
      copy:
        content: "{{ nexus_cmdb_metadata | to_nice_json }}"
        dest: "/tmp/nexus_cmdb_metadata.json"
      delegate_to: localhost
      become: false
      register: cmdb_metadata_file

    - name: Publish metadata to CMDB if configured
      uri:
        url: "{{ cmdb_integration.inventory_source }}/api/services"
        method: POST
        body_format: json
        body: "{{ nexus_cmdb_metadata }}"
        status_code: [200, 201, 400, 401]
      when:
        - cmdb_integration.enabled | bool
        - cmdb_integration.inventory_source != ""
      register: cmdb_publish
      ignore_errors: true

    - name: Log CMDB integration status
      debug:
        msg: |
          CMDB Integration Status:
          - Enabled: {{ cmdb_integration.enabled }}
          - Inventory Source: {{ cmdb_integration.inventory_source if cmdb_integration.inventory_source != "" else "Not configured" }}
          - Update Interval: {{ cmdb_integration.update_interval }} seconds
          - Metadata Tags: {{ cmdb_integration.metadata_tags | join(', ') }}
          - Metadata File: {{ cmdb_metadata_file.dest if cmdb_metadata_file.changed is defined else 'Not written' }}
          - CMDB Publish Status: {{ "Success" if cmdb_publish.status | default(0) in [200, 201] else "Not attempted or failed" }}

  rescue:
    - name: Log CMDB integration failure
      debug:
        msg: "CMDB integration failed, but Nexus deployment continues"
