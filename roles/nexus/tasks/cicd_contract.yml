---
- name: Establish CI/CD health check contract
  block:
    - name: Check Nexus health endpoint
      uri:
        url: "{{ cicd_contract.health_check_endpoint }}"
        method: GET
        status_code: [200, 401]
        timeout: 10
      register: health_check
      retries: 10
      delay: "{{ cicd_contract.health_check_interval }}"
      until: health_check is succeeded

    - name: Verify readiness within timeout
      assert:
        that:
          - health_check is succeeded
        fail_msg: "Nexus health check failed within {{ cicd_contract.readiness_timeout }} seconds"

    - name: Document Nexus API endpoints
      set_fact:
        nexus_api_contract:
          repositories: "{{ cicd_contract.api_endpoints.repositories }}"
          status: "{{ cicd_contract.api_endpoints.status }}"
          components: "{{ cicd_contract.api_endpoints.components }}"
          health_check: "{{ cicd_contract.health_check_endpoint }}"

    - name: Validate API endpoints availability
      uri:
        url: "{{ item.value }}"
        method: GET
        user: "admin"
        password: "{{ security.admin_password }}"
        force_basic_auth: true
        status_code: [200, 401]
      loop: "{{ nexus_api_contract | dict2items }}"
      register: api_validation
      ignore_errors: true

    - name: Enable Prometheus metrics if supported
      block:
        - name: Check Prometheus metrics endpoint
          uri:
            url: "{{ cicd_contract.metrics_endpoint }}"
            method: GET
            user: "admin"
            password: "{{ security.admin_password }}"
            force_basic_auth: true
            status_code: [200, 401]
          register: metrics_check
          ignore_errors: true

        - name: Log metrics availability
          debug:
            msg: "Prometheus metrics available: {{ metrics_check is succeeded }}"
      when: cicd_contract.supports_prometheus | bool

    - name: Document CI/CD integration points
      debug:
        msg: |
          CI/CD Contract Established:
          - Health Check Endpoint: {{ cicd_contract.health_check_endpoint }}
          - Readiness Timeout: {{ cicd_contract.readiness_timeout }} seconds
          - Health Check Interval: {{ cicd_contract.health_check_interval }} seconds
          - Prometheus Metrics: {{ cicd_contract.supports_prometheus }}

          API Endpoints:
          - Repositories: {{ nexus_api_contract.repositories }}
          - Status: {{ nexus_api_contract.status }}
          - Components: {{ nexus_api_contract.components }}

          Endpoint Validation Results:
          - Passed: {{ api_validation.results | selectattr('failed', 'false') | list | length }}
          - Failed: {{ api_validation.results | selectattr('failed', 'true') | list | length }}

  rescue:
    - name: Log CI/CD contract establishment failure
      debug:
        msg: "Warning: CI/CD contract establishment encountered issues, but deployment continues"
