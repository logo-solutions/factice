---
- name: Lister les dépôts existants
  uri:
    url: "{{ nexus_api }}/v1/repositories"
  register: nexus_repos_existing

- name: Dépôts hébergés (candidat et release)
  include_tasks: repository.yml
  vars:
    repo_kind: hosted
    repo_lifecycle: "{{ pair.1 }}"
    repo_name: "{{ pair.0.name }}-{{ pair.1 }}"
    repo_blob: "{{ pair.0.name }}-{{ pair.1 }}"
    fmt: "{{ pair.0 }}"
  loop: "{{ nexus_formats | product(['candidat', 'release']) | list }}"
  loop_control:
    loop_var: pair
    label: "{{ pair.0.name }}-{{ pair.1 }}"

- name: Dépôts proxy
  include_tasks: repository.yml
  vars:
    repo_kind: proxy
    repo_name: "{{ fmt.proxy.name }}"
    repo_blob: "{{ fmt.proxy.name }}"
    repo_remote_url: "{{ fmt.proxy.remote_url }}"
  loop: "{{ nexus_formats | selectattr('proxy') | list }}"
  loop_control:
    loop_var: fmt
    label: "{{ fmt.proxy.name }}"

# Les groupes exposent release + proxy en lecture. Le candidat n'y figure
# jamais : aucun déploiement ne le consomme (3.1).
- name: Groupes de lecture
  include_tasks: repository.yml
  vars:
    repo_kind: group
    repo_name: "{{ fmt.name }}-all"
    repo_blob: "{{ fmt.name }}-release"
    repo_members: ["{{ fmt.name }}-release", "{{ fmt.proxy.name }}"]
  loop: "{{ nexus_formats | selectattr('proxy') | list }}"
  loop_control:
    loop_var: fmt
    label: "{{ fmt.name }}-all"
