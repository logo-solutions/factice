      }
    status_code: [201, 400, 401]
  loop: "{{ repositories.npm | selectattr('type', 'equalto', 'proxy') }}"
  register: npm_proxy_result
  ignore_errors: true

- name: Log repository creation results
  debug:
    msg: |
      Maven proxy: {{ maven_proxy_result.results | length }} configurations
      Maven hosted: {{ maven_hosted_result.results | length }} configurations
      Docker proxy: {{ docker_proxy_result.results | length }} configurations
      Docker hosted: {{ docker_hosted_result.results | length }} configurations
      NPM proxy: {{ npm_proxy_result.results | length }} configurations
