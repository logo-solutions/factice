  uri:
    url: "http://localhost:{{ nexus_docker_port_http }}/service/rest/v1/repositories/docker/hosted"
    method: POST
    user: "admin"
    password: "{{ security.admin_password }}"
    force_basic_auth: true
    body_format: json
    body: |
      {
        "name": "{{ item.name }}",
        "online": true,
        "storage": {
          "blobStoreName": "{{ item.blob_store }}",
          "strictContentTypeValidation": false,
          "writePolicy": "ALLOW_WRITE_ONCE"
        },
        "docker": {
          "forceBasicAuth": false,
          "httpsPort": null,
          "httpPort": 5000,
          "v1Enabled": false
        }
      }
    status_code: [201, 400, 401]
  loop: "{{ repositories.docker | selectattr('type', 'equalto', 'hosted') }}"
  register: docker_hosted_result
  ignore_errors: true

- name: Create NPM proxy repositories
  uri:
    url: "http://localhost:{{ nexus_docker_port_http }}/service/rest/v1/repositories/npm/proxy"
    method: POST
    user: "admin"
    password: "{{ security.admin_password }}"
    force_basic_auth: true
    body_format: json
    body: |
      {
        "name": "{{ item.name }}",
        "online": true,
        "storage": {
          "blobStoreName": "{{ item.blob_store }}",
          "strictContentTypeValidation": true
        },
        "proxy": {
          "remoteUrl": "{{ item.remote_url }}",
          "contentMaxAge": 1440,
