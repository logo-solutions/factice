---
# Candidats non promus et caches proxy (3.4). Les releases ne sont jamais
# nettoyées. L'API de création est l'API interne de l'interface, la seule qui
# existe pour les politiques de nettoyage.
- name: Lister les politiques de nettoyage
  uri:
    url: "{{ nexus_api }}/internal/cleanup-policies"
  register: nexus_cleanup_existing

- name: Politiques sur les candidats
  include_tasks: cleanup_policy.yml
  vars:
    policy_name: "cleanup-candidat-{{ fmt.name }}"
    policy_format: "{{ fmt.nexus_format }}"
    policy_notes: "Candidats {{ fmt.name }} non promus"
    policy_criteria:
      criteriaLastBlobUpdated: "{{ nexus_cleanup_candidat_days | int }}"
  loop: "{{ nexus_formats }}"
  loop_control:
    loop_var: fmt
    label: "{{ fmt.name }}"

- name: Politiques sur les caches proxy
  include_tasks: cleanup_policy.yml
  vars:
    policy_name: "cleanup-proxy-{{ fmt.name }}"
    policy_format: "{{ fmt.nexus_format }}"
    policy_notes: "Cache proxy {{ fmt.name }} non téléchargé"
    policy_criteria:
      criteriaLastDownloaded: "{{ nexus_cleanup_proxy_days | int }}"
  loop: "{{ nexus_formats | selectattr('proxy') | list }}"
  loop_control:
    loop_var: fmt
    label: "{{ fmt.name }}"
