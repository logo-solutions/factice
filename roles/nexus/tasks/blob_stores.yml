---
# Un blob store par dépôt hébergé ou proxy (3.2), avec quota souple.
- name: Lister les blob stores existants
  uri:
    url: "{{ nexus_api }}/v1/blobstores"
  register: nexus_blobstores_existing

- name: Créer les blob stores manquants
  uri:
    url: "{{ nexus_api }}/v1/blobstores/file"
    method: POST
    body_format: json
    body: >-
      {{ {'name': item, 'path': item}
         | combine({'softQuota': {'type': 'spaceUsedQuota', 'limit': (nexus_blob_quota_gb | int) * 1024 * 1024 * 1024}}
                    if nexus_blob_quota_gb else {}) }}
    status_code: [201, 204]
  loop: "{{ nexus_blobstore_names }}"
  when: item not in (nexus_blobstores_existing.json | map(attribute='name') | list)
