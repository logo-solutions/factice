---
- name: Create repository groups via Nexus API
  uri:
    url: "http://localhost:{{ nexus_docker_port_http }}/service/rest/v1/repositories/{{ item.format }}/group"
    method: POST
    user: "admin"
    password: "{{ security.admin_password }}"
    force_basic_auth: true
    body_format: json
    body: |
      {
        "name": "{{ item.name }}",
        "online": true,
        "storage": {
          "blobStoreName": "default"
        },
        "group": {
          "memberNames": {{ item.repositories | to_json }}
        }
      }
    status_code: [201, 400, 401]
  loop: "{{ repository_groups }}"
  register: group_result
  ignore_errors: true

- name: Log repository group creation results
  debug:
    msg: "Repository group {{ item.item.name }} ({{ item.item.format }}): Status {{ item.status | default('Unknown') }}"
  loop: "{{ group_result.results }}"
  when: group_result.results | length > 0

- name: Verify groups were created
  uri:
    url: "http://localhost:{{ nexus_docker_port_http }}/service/rest/v1/repositories"
    method: GET
    user: "admin"
    password: "{{ security.admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: all_repos
  until: all_repos is succeeded
  retries: 3
  delay: 2

- name: Display all repositories
  debug:
    msg: "Total repositories/groups: {{ all_repos.json | length if all_repos.json is defined else 0 }}"
