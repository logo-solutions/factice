---
- name: Deploy Tier 1 - Database (PostgreSQL)
  block:
    - name: Deploy PostgreSQL via Homebrew
      block:
        - name: Install PostgreSQL via Homebrew
          homebrew:
            name: postgresql@16
            state: present

        - name: Create PostgreSQL data directory
          file:
            path: "{{ tier_db_data_dir }}"
            state: directory
            mode: "0755"
          become: true

        - name: Initialize PostgreSQL database cluster
          shell: |
            initdb -D {{ tier_db_data_dir }} -U postgres --locale=en_US.UTF-8
          args:
            creates: "{{ tier_db_data_dir }}/PG_VERSION"
          become: true
          ignore_errors: true

        - name: Start PostgreSQL service
          shell: |
            brew services start postgresql@16
          register: pg_start
          ignore_errors: true

        - name: Wait for PostgreSQL to be ready
          wait_for:
            host: "{{ tier_db_host }}"
            port: "{{ tier_db_port }}"
            timeout: 30
          ignore_errors: true

        - name: Create database user and database
          shell: |
            createuser -U postgres {{ tier_db_user }} 2>/dev/null || true
            createdb -U postgres -O {{ tier_db_user }} {{ tier_db_name }} 2>/dev/null || true
            psql -U postgres -c "ALTER USER {{ tier_db_user }} WITH PASSWORD '{{ tier_db_password }}';" 2>/dev/null || true
          ignore_errors: true

      when: tier_db_type == "homebrew"

    - name: Wait for database connection
      postgresql_query:
        db: "{{ tier_db_name }}"
        login_user: "{{ tier_db_user }}"
        login_password: "{{ tier_db_password }}"
        login_host: "{{ tier_db_host }}"
        port: "{{ tier_db_port }}"
        query: "SELECT 1"
      register: db_ready
      retries: 10
      delay: 3
      until: db_ready is succeeded
      ignore_errors: true

    - name: Run database initialization script
      postgresql_query:
        db: "{{ tier_db_name }}"
        login_user: "{{ tier_db_user }}"
        login_password: "{{ tier_db_password }}"
        login_host: "{{ tier_db_host }}"
        port: "{{ tier_db_port }}"
        query: |
          CREATE TABLE IF NOT EXISTS schema_version (
            version_rank INTEGER,
            installed_version VARCHAR(50) NOT NULL,
            description VARCHAR(200) NOT NULL,
            type VARCHAR(20) NOT NULL,
            script VARCHAR(1000) NOT NULL,
            checksum INTEGER,
            installed_by VARCHAR(100) NOT NULL,
            installed_on TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            execution_time INTEGER NOT NULL,
            success BOOLEAN NOT NULL
          );
      when: db_ready is succeeded
      ignore_errors: true

    - name: Create database backup directory
      file:
        path: "{{ tier_db_backup_dir }}"
        state: directory
        mode: "0755"

    - name: Test database connection
      shell: |
        psql -h {{ tier_db_host }} -p {{ tier_db_port }} -U {{ tier_db_user }} -d {{ tier_db_name }} -c "SELECT 1;" 2>/dev/null
      register: db_test
      ignore_errors: true

    - name: Log database tier deployment
      debug:
        msg: |
          Database Tier Deployed Successfully
          Type: {{ tier_db_type }} (PostgreSQL 16)
          Host: {{ tier_db_host }}
          Port: {{ tier_db_port }}
          Database: {{ tier_db_name }}
          User: {{ tier_db_user }}
          Data Directory: {{ tier_db_data_dir }}
          Backup Directory: {{ tier_db_backup_dir }}
          Connection Status: {{ "OK" if db_test is succeeded else "Check logs" }}

  rescue:
    - name: Log database tier deployment error
      debug:
        msg: |
          Database tier deployment encountered an error
          Check PostgreSQL service: brew services list
          Logs: /usr/local/var/log/postgres.log
          Connection test: psql -h {{ tier_db_host }} -p {{ tier_db_port }} -U {{ tier_db_user }} -d {{ tier_db_name }}
      failed_when: false
