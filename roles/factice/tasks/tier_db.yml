---
# Tier BDD : PostgreSQL natif (cluster Homebrew), une base et un rôle par environnement.
# Un seul cluster pour l'intégration et la production (port 5432, localhost seulement) :
# les conteneurs l'atteignent via host.docker.internal.
# Aucune tâche n'ignore ses erreurs : un échec ici doit casser le déploiement.
- name: Deploy Tier 1 - Database (PostgreSQL natif)
  environment:
    PATH: "{{ tier_db_bin }}:{{ ansible_env.PATH }}"
  block:
    - name: Install PostgreSQL via Homebrew
      community.general.homebrew:
        name: "{{ tier_db_formula }}"
        state: present

    - name: Start PostgreSQL service (si absent)
      ansible.builtin.shell: |
        pg_isready -h {{ tier_db_host }} -p {{ tier_db_port }} -q && exit 0
        brew services start {{ tier_db_formula }}
        for i in $(seq 1 30); do
          pg_isready -h {{ tier_db_host }} -p {{ tier_db_port }} -q && echo started && exit 0
          sleep 1
        done
        exit 1
      register: pg_start
      changed_when: "'started' in pg_start.stdout"

    - name: Create role (mot de passe réaffirmé à chaque déploiement)
      ansible.builtin.shell: psql -d postgres -v ON_ERROR_STOP=1 -h {{ tier_db_host }} -p {{ tier_db_port }} -f -
      args:
        stdin: |
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ tier_db_user }}') THEN
              CREATE ROLE {{ tier_db_user }} LOGIN PASSWORD '{{ tier_db_password }}';
            ELSE
              ALTER ROLE {{ tier_db_user }} PASSWORD '{{ tier_db_password }}';
            END IF;
          END $$;
      changed_when: false
      no_log: true

    - name: Create database
      ansible.builtin.shell: |
        psql -d postgres -tA -h {{ tier_db_host }} -p {{ tier_db_port }} \
          -c "SELECT 1 FROM pg_database WHERE datname = '{{ tier_db_name }}'" | grep -q 1 && exit 0
        createdb -h {{ tier_db_host }} -p {{ tier_db_port }} -O {{ tier_db_user }} {{ tier_db_name }}
        echo created
      register: db_create
      changed_when: "'created' in db_create.stdout"

    - name: Create schema (idempotent)
      ansible.builtin.shell: >
        psql -h {{ tier_db_host }} -p {{ tier_db_port }} -U {{ tier_db_user }}
        -d {{ tier_db_name }} -v ON_ERROR_STOP=1 -f -
      args:
        stdin: |
          CREATE TABLE IF NOT EXISTS items (
            id SERIAL PRIMARY KEY,
            name TEXT NOT NULL,
            created_at TIMESTAMPTZ NOT NULL DEFAULT now()
          );
      environment:
        PGPASSWORD: "{{ tier_db_password }}"
      changed_when: false
      no_log: true

    - name: Create database backup directory
      ansible.builtin.file:
        path: "{{ tier_db_backup_dir }}"
        state: directory
        mode: "0755"

    - name: Test database connection
      ansible.builtin.shell: >
        psql -h {{ tier_db_host }} -p {{ tier_db_port }} -U {{ tier_db_user }}
        -d {{ tier_db_name }} -tA -c "SELECT count(*) FROM items"
      environment:
        PGPASSWORD: "{{ tier_db_password }}"
      changed_when: false
      no_log: true

    - name: Log database tier deployment
      ansible.builtin.debug:
        msg: "BDD prête : {{ tier_db_formula }} sur {{ tier_db_host }}:{{ tier_db_port }}, base {{ tier_db_name }}, rôle {{ tier_db_user }}"
